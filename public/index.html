<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agent-demo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>agent-demo</h1>
      <p class="subtitle">
        A minimal app scaffolded for spec-driven development with GitHub Spec Kit.
      </p>

      <form id="note-form" autocomplete="off">
        <input id="note-input" type="text" placeholder="Write a note…" maxlength="200" required />
        <button type="submit">Add</button>
      </form>

      <ul id="note-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty">No notes yet — add your first one above.</p>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
